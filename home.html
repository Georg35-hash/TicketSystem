<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TICKET-ABLAGE · Amt für Zurückhaltende Reaktionen</title>
    <style>
      :root {
        --paper: #dcc99a;
        --paper-dark: #cbb583;
        --card: #f2e7c9;
        --card-edge: #d8c79a;
        --ink: #2b2116;
        --ink-soft: #5a4d38;
        --stamp-red: #a6342b;
        --stamp-teal: #2f6b5e;
        --stamp-grey: #6b6255;
        --line: #b8a47c;
        --shadow: rgba(43, 33, 22, 0.28);
        --focus: #1f5f8b;
      }
      :root:not([data-theme="light"]) {
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #3a2f22;
          --paper-dark: #2e251a;
          --card: #4a3c2a;
          --card-edge: #5c4b33;
          --ink: #ecdfc4;
          --ink-soft: #c9b78e;
          --line: #6b5a3e;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        --paper: #3a2f22;
        --paper-dark: #2e251a;
        --card: #4a3c2a;
        --card-edge: #5c4b33;
        --ink: #ecdfc4;
        --ink-soft: #c9b78e;
        --line: #6b5a3e;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        scroll-behavior: stable;
      }
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(
            1200px 600px at 10% -10%,
            rgba(255, 255, 255, 0.06),
            transparent
          ),
          var(--paper-dark);
        color: var(--ink);
        font-family: "Courier New", Courier, monospace;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }

      /* ---------- Header ---------- */
      header {
        background: var(--paper);
        border: 1px solid var(--card-edge);
        border-radius: 2px;
        padding: 22px 24px;
        position: relative;
        box-shadow: 0 10px 24px var(--shadow);
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(43, 33, 22, 0.05) 28px
        );
      }
      header::before {
        content: "AKTE Nr. 0042";
        position: absolute;
        top: -11px;
        left: 24px;
        background: var(--card);
        border: 1px solid var(--card-edge);
        padding: 2px 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--ink-soft);
        border-radius: 2px;
      }
      h1 {
        margin: 6px 0 4px;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .subtitle {
        color: var(--ink-soft);
        font-size: 14px;
        margin: 0 0 16px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 6px;
      }
      .stat {
        border: 1px dashed var(--line);
        padding: 8px 12px;
        border-radius: 2px;
        font-size: 12.5px;
        background: rgba(255, 255, 255, 0.06);
      }
      .stat b {
        display: block;
        font-size: 17px;
        margin-bottom: 2px;
      }

      .stamp {
        position: absolute;
        top: 14px;
        right: 18px;
        border: 3px solid var(--stamp-red);
        color: var(--stamp-red);
        padding: 6px 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 13px;
        transform: rotate(-8deg);
        border-radius: 6px;
        opacity: 0.85;
        user-select: none;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        .stamp {
          position: static;
          display: inline-block;
          margin-top: 10px;
          transform: rotate(-4deg);
        }
      }

      /* ---------- Layout ---------- */
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
        margin-top: 20px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- Form ---------- */
      .form-panel {
        background: var(--paper);
        border: 1px solid var(--card-edge);
        border-radius: 2px;
        padding: 18px;
        position: sticky;
        top: 16px;
        box-shadow: 0 8px 18px var(--shadow);
      }
      .form-panel h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .form-panel .hint {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--ink-soft);
        margin: 12px 0 4px;
      }
      input[type="text"],
      textarea,
      select {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--card-edge);
        border-bottom: 1px dashed var(--line);
        color: var(--ink);
        font-family: inherit;
        font-size: 13.5px;
        padding: 8px 9px;
        border-radius: 2px;
      }
      input[type="text"]:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
        min-height: 64px;
      }

      .submit-btn {
        margin-top: 16px;
        width: 100%;
        background: var(--stamp-teal);
        color: #f2e7c9;
        border: none;
        padding: 11px;
        font-family: inherit;
        font-weight: 700;
        letter-spacing: 0.03em;
        font-size: 13.5px;
        border-radius: 3px;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      }
      .submit-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      }
      .submit-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .grumble {
        margin-top: 10px;
        font-size: 11px;
        color: var(--ink-soft);
        text-align: center;
      }

      /* ---------- Board ---------- */
      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(230px, 1fr));
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      @media (max-width: 860px) {
        .board {
          grid-template-columns: 1fr;
          overflow-x: visible;
        }
      }

      .column {
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid var(--card-edge);
        border-radius: 3px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
      }
      .column-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--card-edge);
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .column-head .count {
        font-weight: 400;
        color: var(--ink-soft);
        font-size: 11px;
      }
      .column-body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .empty-note {
        font-size: 11.5px;
        color: var(--ink-soft);
        text-align: center;
        padding: 14px 6px;
        font-style: italic;
      }

      /* ---------- Ticket card ---------- */
      .ticket {
        background: var(--card);
        border: 1px solid var(--card-edge);
        border-radius: 2px;
        padding: 11px 12px 10px;
        position: relative;
        box-shadow: 0 3px 8px var(--shadow);
        animation: drop 0.35s ease;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-6px) rotate(-1deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }
      .ticket::before {
        content: "";
        position: absolute;
        top: 6px;
        left: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.15);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
      }
      .ticket-title {
        font-weight: 700;
        font-size: 13.5px;
        margin: 0 0 4px 10px;
        line-height: 1.3;
      }
      .ticket-desc {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 0 0 8px 10px;
        line-height: 1.4;
      }
      .ticket-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 0 0 8px 10px;
      }
      .tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        border: 1px solid var(--card-edge);
        color: var(--ink-soft);
        background: rgba(0, 0, 0, 0.04);
      }
      .tag.prio-hoch {
        color: var(--stamp-red);
        border-color: var(--stamp-red);
      }
      .tag.prio-mittel {
        color: #8a6b1e;
        border-color: #8a6b1e;
      }
      .tag.prio-niedrig {
        color: var(--stamp-teal);
        border-color: var(--stamp-teal);
      }

      .ticket-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-left: 10px;
        gap: 6px;
      }
      .reporter {
        font-size: 10.5px;
        color: var(--ink-soft);
      }
      .ticket-actions {
        display: flex;
        gap: 4px;
      }
      .ticket-actions button {
        font-family: inherit;
        font-size: 10.5px;
        background: transparent;
        border: 1px solid var(--card-edge);
        color: var(--ink-soft);
        padding: 3px 6px;
        border-radius: 2px;
        cursor: pointer;
      }
      .ticket-actions button:hover {
        border-color: var(--ink-soft);
        color: var(--ink);
      }
      .ticket-actions button:focus-visible {
        outline: 2px solid var(--focus);
      }

      .age {
        display: inline-block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--ink-soft);
      }
      .age.old {
        color: var(--stamp-red);
        font-weight: 700;
      }

      footer {
        margin-top: 26px;
        text-align: center;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: var(--card);
        padding: 10px 16px;
        border-radius: 4px;
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        max-width: 90vw;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .ticket {
          animation: none;
        }
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Ticket-Ablage</h1>
        <p class="subtitle">
          Amt für Zurückhaltende Reaktionen &nbsp;·&nbsp; Zuständig, aber
          unterbesetzt
        </p>
        <div class="stats" id="stats"></div>
      </header>

      <div class="layout">
        <section class="form-panel">
          <h2>Neues Anliegen einreichen</h2>
          <p class="hint">Wird gelesen. Irgendwann. Vermutlich.</p>

          <form id="ticketForm">
            <label for="title">Worum geht's</label>
            <input
              type="text"
              id="title"
              maxlength="60"
              placeholder="z. B. Drucker macht Geräusche"
              required
            />

            <label for="desc">Beschreibung</label>
            <textarea
              id="desc"
              maxlength="220"
              placeholder="Bitte möglichst dramatisch schildern."
            ></textarea>

            <label for="category">Kategorie</label>
            <select id="category">
              <option>Technik streikt</option>
              <option>Passwort vergessen (schon wieder)</option>
              <option>WLAN fühlt sich nicht gesehen</option>
              <option>Drucker brennt (im übertragenen Sinne)</option>
              <option>Sonstiges Chaos</option>
            </select>

            <label for="prio">Dringlichkeit</label>
            <select id="prio">
              <option value="niedrig">Kann warten</option>
              <option value="mittel">Wäre nett, bald</option>
              <option value="hoch">Angeblich super wichtig</option>
            </select>

            <label for="reporter">Gemeldet von</label>
            <input
              type="text"
              id="reporter"
              maxlength="30"
              placeholder="Dein Name"
            />

            <button type="submit" class="submit-btn">Ticket einreichen</button>
          </form>
          <p class="grumble">Durchschnittliche Reaktionszeit: unbekannt.</p>
        </section>

        <section class="board" id="board" aria-label="Ticket-Übersicht">
          <!-- Spalten werden per JS befüllt -->
        </section>
      </div>

      <footer>
        * Einstufung erfolgt automatisch und wird nicht überprüft. Widerspruch
        aussichtslos.
      </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      (function () {
        "use strict";

        var COLUMNS = [
          { id: "eingegangen", label: "Eingegangen" },
          { id: "ignoriert", label: "Ignoriert" },
          { id: "bearbeitung", label: "In Bearbeitung (Kaffeepause)" },
          { id: "erledigt", label: "Erledigt (aus Versehen)" },
        ];

        var EMPTY_NOTES = {
          eingegangen: "Hier herrscht gerade Ruhe. Verdächtig.",
          ignoriert:
            "Noch nichts wurde konsequent ignoriert. Das ändert sich sicher.",
          bearbeitung: "Niemand macht gerade Kaffeepause. Ungewöhnlich.",
          erledigt: "Erfolge sind rar. Wie erwartet.",
        };

        var PRIO_LABEL = {
          niedrig: "Kann warten",
          mittel: "Wäre nett",
          hoch: "Angeblich wichtig",
        };

        var STORAGE_KEY = "ticket-ablage-v1";
        var tickets = [];
        var nextId = 1;

        function loadState() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              var data = JSON.parse(raw);
              tickets = data.tickets || [];
              nextId = data.nextId || tickets.length + 1;
              return;
            }
          } catch (e) {
            /* kein Speicher, kein Problem */
          }
          seedDemo();
        }

        function saveState() {
          try {
            localStorage.setItem(
              STORAGE_KEY,
              JSON.stringify({ tickets: tickets, nextId: nextId }),
            );
          } catch (e) {
            /* Speicher nicht verfügbar - Zustand bleibt nur in dieser Sitzung */
          }
        }

        function seedDemo() {
          var now = Date.now();
          tickets = [
            {
              id: nextId++,
              title: "Drucker macht Geräusche wie ein Muffin-Mixer",
              desc: "Seit Montag. Niemand traut sich hin.",
              category: "Drucker brennt (im übertragenen Sinne)",
              prio: "mittel",
              reporter: "F. Krause",
              status: "eingegangen",
              created: now - 1000 * 60 * 60 * 26,
            },
            {
              id: nextId++,
              title: "WLAN heißt jetzt 'Kein Internet für dich'",
              desc: "Vermutlich Absicht.",
              category: "WLAN fühlt sich nicht gesehen",
              prio: "hoch",
              reporter: "S. Bode",
              status: "ignoriert",
              created: now - 1000 * 60 * 60 * 24 * 4,
            },
            {
              id: nextId++,
              title: "Kaffeemaschine als 'IT-Problem' gemeldet",
              desc: "Aus Verzweiflung. Bitte trotzdem lesen.",
              category: "Sonstiges Chaos",
              prio: "niedrig",
              reporter: "anonym",
              status: "bearbeitung",
              created: now - 1000 * 60 * 60 * 3,
            },
            {
              id: nextId++,
              title: "Monitor flackert im Takt der Musik",
              desc: "War wohl nur ein loses Kabel.",
              category: "Technik streikt",
              prio: "niedrig",
              reporter: "J. Ahrens",
              status: "erledigt",
              created: now - 1000 * 60 * 60 * 50,
            },
          ];
          saveState();
        }

        function fmtAge(ts) {
          var created = createdTimestamp(ts);
          if (created === null) return "Alter unbekannt";
          var diffMs = Date.now() - created;
          var hours = Math.floor(diffMs / 3600000);
          if (hours < 1) return "gerade erst gemeldet";
          if (hours < 24) return hours + " Std. offen";
          var days = Math.floor(hours / 24);
          return days + " Tag" + (days === 1 ? "" : "e") + " offen";
        }

        function createdTimestamp(value) {
          if (typeof value === "number" && Number.isFinite(value)) return value;
          if (typeof value === "string" && value.trim() !== "") {
            var numeric = Number(value);
            if (Number.isFinite(numeric)) return numeric;
          }
          var parsed = Date.parse(value);
          return Number.isFinite(parsed) ? parsed : null;
        }

        function isOld(ts) {
          var created = createdTimestamp(ts);
          return created !== null && Date.now() - created > 1000 * 60 * 60 * 24 * 2;
        }

        function renderStats() {
          var open = tickets.filter(function (t) {
            return t.status !== "erledigt";
          }).length;
          var oldestAgeDays = 0;
          tickets.forEach(function (t) {
            var created = createdTimestamp(t.created);
            if (created === null) return;
            var d = Math.floor((Date.now() - created) / 86400000);
            if (d > oldestAgeDays) oldestAgeDays = d;
          });
          var doneCount = tickets.filter(function (t) {
            return t.status === "erledigt";
          }).length;
          var rate = tickets.length
            ? Math.round((doneCount / tickets.length) * 100)
            : 0;

          var html =
            '<div class="stat"><b>' +
            tickets.length +
            "</b>Tickets insgesamt</div>" +
            '<div class="stat"><b>' +
            open +
            "</b>noch offen</div>" +
            '<div class="stat"><b>' +
            oldestAgeDays +
            "</b>Tage ältestes Ticket</div>" +
            '<div class="stat"><b>' +
            rate +
            " %</b>angeblich erledigt</div>";
          document.getElementById("stats").innerHTML = html;
        }

        function renderBoard() {
          var board = document.getElementById("board");
          board.innerHTML = "";

          COLUMNS.forEach(function (col) {
            var colTickets = tickets.filter(function (t) {
              return t.status === col.id;
            });

            var colEl = document.createElement("div");
            colEl.className = "column";

            var head = document.createElement("div");
            head.className = "column-head";
            head.innerHTML =
              "<span>" +
              col.label +
              '</span><span class="count">' +
              colTickets.length +
              "</span>";
            colEl.appendChild(head);

            var body = document.createElement("div");
            body.className = "column-body";
            if (colTickets.length === 0) {
              var note = document.createElement("div");
              note.className = "empty-note";
              note.textContent = EMPTY_NOTES[col.id];
              body.appendChild(note);
            } else {
              colTickets
                .slice()
                .sort(function (a, b) {
                  return (createdTimestamp(b.created) || 0) - (createdTimestamp(a.created) || 0);
                })
                .forEach(function (t) {
                  body.appendChild(renderTicket(t, col.id));
                });
            }

            colEl.appendChild(body);
            board.appendChild(colEl);
          });
        }

        function renderTicket(t, currentColId) {
          var el = document.createElement("div");
          el.className = "ticket";
          el.draggable = true;
          el.dataset.ticketId = t.id;

          var title = document.createElement("p");
          title.className = "ticket-title";
          title.textContent = t.title;
          el.appendChild(title);

          if (t.desc) {
            var desc = document.createElement("p");
            desc.className = "ticket-desc";
            desc.textContent = t.desc;
            el.appendChild(desc);
          }

          var meta = document.createElement("div");
          meta.className = "ticket-meta";
          var catTag = document.createElement("span");
          catTag.className = "tag";
          catTag.textContent = t.category;
          meta.appendChild(catTag);
          var prioTag = document.createElement("span");
          prioTag.className = "tag prio-" + t.prio;
          prioTag.textContent = PRIO_LABEL[t.prio];
          meta.appendChild(prioTag);
          el.appendChild(meta);

          var foot = document.createElement("div");
          foot.className = "ticket-foot";

          var left = document.createElement("div");
          var reporter = document.createElement("div");
          reporter.className = "reporter";
          reporter.textContent = "von " + (t.reporter || "anonym");
          left.appendChild(reporter);
          var age = document.createElement("div");
          age.className = "age" + (isOld(t.created) ? " old" : "");
          age.textContent = fmtAge(t.created);
          left.appendChild(age);
          foot.appendChild(left);

          var actions = document.createElement("div");
          actions.className = "ticket-actions";

          var idx = COLUMNS.findIndex(function (c) {
            return c.id === currentColId;
          });
          if (idx < COLUMNS.length - 1) {
            var nextBtn = document.createElement("button");
            nextBtn.type = "button";
            nextBtn.textContent = "weiter →";
            nextBtn.addEventListener("click", function () {
              t.status = COLUMNS[idx + 1].id;
              saveState();
              renderAll();
              showToast(toastForMove(COLUMNS[idx + 1].id));
            });
            actions.appendChild(nextBtn);
          }

          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.textContent = "vergessen";
          delBtn.addEventListener("click", function () {
            tickets = tickets.filter(function (x) {
              return x.id !== t.id;
            });
            saveState();
            renderAll();
            showToast("Ticket erfolgreich verdrängt.");
          });
          actions.appendChild(delBtn);

          foot.appendChild(actions);
          el.appendChild(foot);

          return el;
        }

        function toastForMove(statusId) {
          switch (statusId) {
            case "ignoriert":
              return "Ticket wird nun offiziell ignoriert.";
            case "bearbeitung":
              return "Bearbeitung beginnt. Kaffee wird geholt.";
            case "erledigt":
              return "Als erledigt markiert. Glückwunsch, vermutlich.";
            default:
              return "Status geändert.";
          }
        }
        
        var board = document.getElementById("board");
        board.addEventListener("dragstart", function (ev) {
          var ticketEl = ev.target.closest(".ticket");
          if (!ticketEl) return;
          ev.dataTransfer.setData("text/plain", ticketEl.dataset.ticketId);
          ev.dataTransfer.effectAllowed = "move";
        });
        board.addEventListener("dragover", function (ev) {
          if (ev.target.closest(".column-body")) ev.preventDefault();
        });
        board.addEventListener("drop", function (ev) {
          var columnBody = ev.target.closest(".column-body");
          if (!columnBody) return;
          ev.preventDefault();
          var ticketId = Number(ev.dataTransfer.getData("text/plain"));
          var column = columnBody.closest(".column");
          var columnIndex = Array.prototype.indexOf.call(board.children, column);
          var ticket = tickets.find(function (item) {
            return item.id === ticketId;
          });
          if (!ticket || columnIndex < 0 || columnIndex >= COLUMNS.length) return;
          ticket.status = COLUMNS[columnIndex].id;
          saveState();
          renderAll();
          showToast(toastForMove(ticket.status));
        });
        var toastTimer = null;
        function showToast(msg) {
          var el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.classList.remove("show");
          }, 2200);
        }

        function renderAll() {
          renderStats();
          renderBoard();
        }

        document
          .getElementById("ticketForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            var title = document.getElementById("title").value.trim();
            if (!title) return;

            var t = {
              id: nextId++,
              title: title,
              desc: document.getElementById("desc").value.trim(),
              category: document.getElementById("category").value,
              prio: document.getElementById("prio").value,
              reporter: document.getElementById("reporter").value.trim(),
              status: "eingegangen",
              created: Date.now(),
            };
            tickets.push(t);
            saveState();
            renderAll();
            showToast("Ticket eingereicht. Es reiht sich ein.");
            this.reset();
            document.getElementById("title").focus();
          });

        loadState();
        renderAll();
      })();
    </script>
  </body>
</html>
